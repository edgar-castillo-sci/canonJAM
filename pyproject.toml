[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "canonjam"
version = "1.2.0"
description = "Canonicalization of JAM strings for duplicate detection in layered materials"
readme = "README.md"
requires-python = ">=3.19"
license = {text = "MIT"}
authors = [
    {name = "Edgar Castillo", email = "edgar.castillo.sci@gmail.com"},
]
dependencies = [
    "numpy",
]
keywords = ["JAM", "canonicalization", "symmetry", "2D materials", "duplicate detection"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/edgar-castillo-sci/canonJAM"
Documentation = "https://github.com/edgar-castillo-sci/canonJAM#readme"
Source = "https://github.com/edgar-castillo-sci/canonJAM"

[project.optional-dependencies]
tests = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["canonjam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "tests/comparison",
    "tests/exploration",
    "*.egg",
    ".*",
    "__pycache__",
    "build",
    "dist",
]
